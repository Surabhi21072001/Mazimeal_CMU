name: PostgreSQL data integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
        env:
          POSTGRES_USER: mazimeal_integration
          POSTGRES_DB: mazimeal_integration
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U mazimeal_integration -d mazimeal_integration"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      MAZIMEAL_DSN: postgresql://mazimeal_integration:ephemeral-ci-only@127.0.0.1:5434/mazimeal_integration
      MAZIMEAL_RUN_DB_TESTS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r data_engineering/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python data_engineering/manage.py bootstrap
      - run: python -m unittest discover -s data_engineering -v
      - run: python data_engineering/manage.py report
